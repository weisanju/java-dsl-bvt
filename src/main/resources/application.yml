spring:
  application:
    name: java-dsl-bvt
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bvt}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  execution:
    step-timeout-ms: 5000
    case-timeout-ms: 60000
    snapshot-max-chars: 16384
